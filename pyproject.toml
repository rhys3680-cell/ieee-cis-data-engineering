[project]
name = "ieeecisdataengineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rhys", email = "rhys3680@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "google-cloud-bigquery>=3.44.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "google-cloud-storage>=3.13.1",
    "kaggle>=2.2.4",
    "lightgbm>=4.7.0",
    "mlflow-skinny>=3.15",
    "pandas>=3.0.5",
    "pandas-gbq>=0.35.2",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# package = false 라 src 가 설치되지 않는다. 루트를 경로에 넣어야
# from src.common... 임포트가 된다.
pythonpath = ["."]
testpaths = ["tests"]
markers = ["bq: BigQuery 를 실제로 조회한다. 느리다."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
