x-airflow-common: &airflow-common
  build:
    context: ./docker/airflow
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # 컨테이너 안에서 프로젝트 코드를 임포트할 수 있게 한다.
    # /opt/project 는 src 임포트용, dags 는 DAG 끼리 공유하는 모듈(assets)용.
    # Airflow 3 은 dags 디렉터리를 자동으로 sys.path 에 넣지 않는다.
    PYTHONPATH: /opt/project:/opt/airflow/dags
    # ADC. 호스트의 gcloud 자격증명을 마운트해 쓴다.
    # 두 이름이 모두 필요하다. GOOGLE_CLOUD_PROJECT 는 google 클라이언트
    # 라이브러리가 기본 프로젝트로 읽고, GCP_PROJECT_ID 는 src.common.config 가
    # pydantic-settings 로 읽는다. 컨테이너에는 .env 파일이 없다.
    GOOGLE_CLOUD_PROJECT: ${GCP_PROJECT_ID}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID}
    GCS_BUCKET: ${GCS_BUCKET}
    BQ_DATASET_RAW: ${BQ_DATASET_RAW:-ieee_raw}
    # SimpleAuthManager 는 비밀번호를 자동 생성해 로그에 찍는다. 컨테이너를
    # 다시 만들 때마다 바뀌므로 파일을 미리 두어 고정한다.
    # 개발·테스트용이며, 운영에서는 FAB 이나 Keycloak 같은 실제 인증
    # 관리자를 쓰거나 다른 수단으로 접근을 통제해야 한다.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./src:/opt/project/src
    - ./dbt:/opt/project/dbt
    # Windows의 gcloud ADC. 읽기 전용으로 붙인다.
    - ${APPDATA}/gcloud:/home/airflow/.config/gcloud:ro
    - ./docker/airflow/simple_auth_passwords.json:/opt/airflow/config/passwords.json

  # airflow 이미지의 기본 UID. 리눅스에서는 호스트 UID 를 맞춰야 마운트한
  # 볼륨의 소유권이 어긋나지 않지만, Windows 는 그 개념이 없어 기본값을 쓴다.
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # Airflow 3 은 SimpleAuthManager 가 기본이라 사용자를 CLI 로 만들지 않는다.
    # users create 는 AirflowSecurityManagerV2 에 find_role 이 없어 실패한다.
    command: -c "airflow db migrate"
    depends_on:
      postgres:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
