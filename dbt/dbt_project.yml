name: ieee_cis
version: 1.0.0

profile: ieee_cis

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ieee_cis:
    staging:
      # 원본을 표준화만 한 계층이라 뷰로 둔다. 저장 비용이 없고
      # 원본이 바뀌면 자동으로 바뀐다.
      +materialized: view
      +schema: staging
    marts:
      # 조인과 집계가 들어가 매번 계산하면 비용이 발생한다. 테이블로 만든다.
      +materialized: table
      +schema: mart

vars:
  valid_start: "2018-05-04"
  # 차단율 추이를 볼 때의 기준 임계값. fp_cost $5 가정에서 나온 값이다.
  # 화면에서 슬라이더로 만지는 임계값과는 별개 — 여기는 고정된 기준이
  # 있어야 날짜 간 비교가 성립한다.
  block_threshold: 0.43
  # 고액 경계. 상위 10% 근처다. 사기율이 아니라 손실 규모로 나눈다.
  high_amount: 250
  # 피처 구간을 그릴 최소 건수. 사기 사례가 몇 건뿐이면 비율이 우연히 튄다.
  min_bucket_rows: 1000
  # 피처당 최빈값 몇 개까지 볼지. 꼬리까지 내면 표가 수천 행이 된다.
  top_values_per_feature: 5
