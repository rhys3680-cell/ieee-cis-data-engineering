name: ieee_cis
version: 1.0.0

profile: ieee_cis

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  ieee_cis:
    staging:
      # 원본을 표준화만 한 계층이라 뷰로 둔다. 저장 비용이 없고
      # 원본이 바뀌면 자동으로 바뀐다.
      +materialized: view
      +schema: staging
    marts:
      # 조인과 집계가 들어가 매번 계산하면 비용이 발생한다. 테이블로 만든다.
      +materialized: table
      +schema: mart

vars:
  valid_start: "2018-05-04"
  # 차단율 추이를 볼 때의 기준 임계값. fp_cost $5 가정에서 나온 값이다.
  # 화면에서 슬라이더로 만지는 임계값과는 별개 — 여기는 고정된 기준이
  # 있어야 날짜 간 비교가 성립한다.
  block_threshold: 0.43
