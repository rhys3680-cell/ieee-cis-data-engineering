version: 2

sources:
  - name: ieee_raw
    description: >
      Kaggle IEEE-CIS 원본을 GCS Parquet를 거쳐 적재한 것.
      원본 값 그대로이며, 파이프라인을 거치며 세 개의 컬럼을 추가했다.
      (transaction_date, source_split, ingested_at).
    # database는 적지 않는다. profiles.yml의 project를 따르므로
    # 이 파일에 프로젝트 ID를 적지 않는 편이 안전하다.
    schema: ieee_raw

    tables:
      - name: transactions
        description: 거래 원본. 394개 원본 컬럼 + 파이프라인 컬럼 3개.
        columns:
          - name: TransactionID
            description: 거래 식별자. transactions와 identity의 조인 키.
            tests:
              - unique
              - not_null
          - name: transaction_date
            description: >
              TransactionDT(초 오프셋)를 날짜로 바꾼 파티션 키.
              기준일은 임의값이라 절대 날짜에 의미는 없다.
            tests:
              - not_null
          - name: isFraud
            description: 사기 여부. test 구간은 라벨이 없어 NULL이다.
          - name: source_split
            description: train / test
            tests:
              - accepted_values:
                  arguments:
                    values: ["train", "test"]

      - name: predictions
        description: >
          배치 추론이 남긴 사기 점수. src/ml/batch.py 가 하루치씩 쓴다.
          판정이 아니라 점수만 있다 — 임계값은 비용 가정에 따라 움직이므로
          소비처가 적용한다.
        columns:
          - name: transaction_id
            tests: [unique, not_null]
          - name: score
            tests: [not_null]
          - name: model
            description: 어느 모델이 매긴 점수인지. 분포가 바뀌었을 때 원인을 가른다.
            tests: [not_null]

      - name: identity
        description: 기기·네트워크 정보. 전체 거래의 약 25%에만 존재한다.
        columns:
          - name: TransactionID
            tests:
              - unique
              - not_null
              - relationships:
                  arguments:
                    to: source('ieee_raw', 'transactions')
                    field: TransactionID
