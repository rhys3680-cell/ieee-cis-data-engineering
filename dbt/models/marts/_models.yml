version: 2

models:
  - name: fct_transactions
    description: >
      거래 팩트. transaction 에 identity 를 LEFT JOIN 했다.
      한 행이 거래 한 건이며, 익명 컬럼(V*, C*, D*, M*)은 올리지 않는다.
    tests:
      # identity 는 1:1 이므로 조인해도 행이 늘면 안 된다.
      # 늘어난다면 소스에 중복이 생긴 것이다.
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('stg_transactions')

    columns:
      - name: transaction_id
        description: 거래 식별자
        tests:
          - unique
          - not_null

      - name: transaction_date
        description: 파티션 키. 기준일이 임의값이라 절대 날짜에 의미는 없다.
        tests:
          - not_null

      - name: transaction_hour
        description: >
          하루 중 시각(0~23). 패턴 비교에만 쓴다.
          거래가 적은 시각(7~9)에 사기율이 평균의 3배로 나타난다.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 23

      - name: transaction_amt
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

      - name: source_split
        tests:
          - accepted_values:
              arguments:
                values: ["train", "test"]

      - name: has_identity
        description: identity 조인 성공 여부. 전체의 약 26% 다.
        tests:
          - not_null

      - name: is_fraud
        description: >
          사기 여부. test 구간은 조사 중이라 NULL 이다.
          실무에서도 최근 거래는 라벨이 비어 있으므로 정상 상태로 다룬다.

  - name: agg_transactions_daily
    description: >
      거래 집계. 날짜 x 시각 x split x 제품 x 기기로 자른다.
      대시보드가 매번 110만 행을 스캔하지 않도록 미리 줄인 것이다.
    tests:
      # 집계해도 건수 합계는 팩트와 같아야 한다. 다르면 GROUP BY 에서
      # NULL 키 때문에 행이 빠졌거나 조인이 섞인 것이다.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (select sum(tx_count) from {{ ref('agg_transactions_daily') }})
              = (select count(*) from {{ ref('fct_transactions') }})
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: tx_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: fraud_rate
        description: >
          라벨이 있는 거래의 사기 비율. test 구간은 라벨이 없어 NULL 이다.
          NULL 은 '사기가 없다'가 아니라 '알 수 없다'이므로
          labeled_count 와 함께 봐야 한다.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1

  - name: agg_pipeline_daily
    description: >
      파이프라인 상태. 적재량과 결측률로 소스·적재 이상을 감지한다.
      한 행이 날짜 x split 하나다.
    columns:
      - name: transaction_date
        tests: [not_null]
      - name: tx_count
        tests: [not_null]
      - name: identity_rate
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
      - name: tx_count_vs_baseline
        description: >
          직전 7일 평균 대비 건수 비율. 1 에서 크게 벗어나면 이상이다.
          첫 7일은 기준선이 없어 NULL 이다.

  - name: dim_split
    description: ML 학습용 날짜 분할. 시간 순서로 자른다.
    columns:
      - name: transaction_date
        description: 날짜 하나당 행 하나.
        tests: [unique, not_null]
      - name: ml_split
        description: train / valid / test.
        tests:
          - not_null
          - accepted_values:
              values: ["train", "valid", "test"]
